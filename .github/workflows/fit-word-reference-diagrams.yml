name: Fit Word reference figures
on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
permissions:
  contents: write
jobs:
  fit:
    if: github.repository == 'DruHustle/portfolio' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'content/factory-source-audit-20261106'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: content/factory-source-audit-20261106
      - name: Bound picture sizes without altering fonts or content
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import re
          for p in Path('portfolio-frontend/client/public/docs/smartfactoryiot').glob('*.docx'):
              with ZipFile(p) as z:
                  items = {n: z.read(n) for n in z.namelist()}
              s = items['word/document.xml'].decode()
              def fit(m):
                  x, y = int(m['x']), int(m['y'])
                  ratio = min(1, 4389120 / x)
                  return f'<{m["tag"]} cx="{round(x*ratio)}" cy="{round(y*ratio)}"{m["tail"]}/>'
              s, count = re.subn(r'<(?P<tag>wp:extent|a:ext) cx="(?P<x>\d+)" cy="(?P<y>\d+)"(?P<tail>[^>]*)/>', fit, s)
              if count == 0:
                  raise ValueError(f'No picture extents in {p}')
              s = re.sub(r'descr="/tmp/portfolio-docx-media/[^"]+"', 'descr="Rendered reference diagram"', s)
              items['word/document.xml'] = s.encode()
              with ZipFile(p, 'w', ZIP_DEFLATED) as z:
                  for n, data in items.items():
                      z.writestr(n, data)
              print(p.name, count)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add portfolio-frontend/client/public/docs/smartfactoryiot/*.docx
          git commit -m 'Bound Word reference figures to reviewed page width'
          git push origin HEAD:content/factory-source-audit-20261106
