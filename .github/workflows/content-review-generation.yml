name: Generate reviewed content assets

on:
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.repository == 'DruHustle/portfolio' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'content/factory-source-audit-20261106'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout the reviewed content branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: content/factory-source-audit-20261106
      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: portfolio-frontend/package.json
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Install authoring tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pandoc poppler-utils
          pnpm --dir portfolio-frontend install --frozen-lockfile
          cd portfolio-frontend
          pnpm exec playwright install --with-deps chromium
      - name: Apply source-pinned content review
        run: python3 scripts/refresh-reviewed-content.py
      - name: Generate architecture and current guide editions
        working-directory: portfolio-frontend
        run: |
          pnpm architecture:build
          DOC_PROJECT=smartfactoryiot pnpm docs:build
          for name in architecture api-flows database-schema; do
            pandoc -f html -t docx --reference-doc="client/public/docs/smartfactoryiot/$name.docx" --resource-path=client/public/docs/smartfactoryiot "client/public/docs/smartfactoryiot/$name.html" -o "/tmp/$name.docx"
            cp "/tmp/$name.docx" "client/public/docs/smartfactoryiot/$name.docx"
          done
          for pdf in client/public/docs/smartfactoryiot/*.pdf; do
            pdftotext "$pdf" - | grep -qi CloudAMQP && exit 1 || test "${PIPESTATUS[0]}" -eq 0
          done
      - name: Commit only reviewed source and generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/portfolio-content-review.json portfolio-frontend/client portfolio-frontend/design portfolio-frontend/scripts portfolio-frontend/e2e/content-preservation.spec.ts
          git diff --cached --check
          git commit -m 'Correct Mosquitto and Python roles from pinned project documentation; regenerate guides'
          git push origin HEAD:content/factory-source-audit-20261106
      - name: Save generation evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reviewed-content-assets
          path: |
            docs/portfolio-content-review.json
            portfolio-frontend/client/public/docs/smartfactoryiot
            portfolio-frontend/client/public/images/smart_factory_arch.svg
          retention-days: 7
