name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify portfolio
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: portfolio-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: portfolio-frontend/package.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            portfolio-frontend/pnpm-lock.yaml
            portfolio-backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=moderate

      - name: Install backend
        working-directory: portfolio-backend
        run: pnpm install --frozen-lockfile

      - name: Audit backend
        working-directory: portfolio-backend
        run: pnpm audit --audit-level=moderate

      - name: Verify backend
        working-directory: portfolio-backend
        run: |
          pnpm lint
          pnpm check
          pnpm test
          pnpm build
          pnpm test:deployment

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check

      - name: Run unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser verification
        run: pnpm exec playwright test

      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-verification
          path: portfolio-frontend/artifacts/browser
          retention-days: 7
          if-no-files-found: ignore
