<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title description">
<title id="title">Smart Farmer — system architecture</title>
<desc id="description">Independent web and native iPhone iPad Android clients use farm-scoped authorization and encrypted offline sync. Boreholes, pumps, pivots and ONVIF cameras connect via an independent edge gateway using checked HTTP, MQTT, Modbus and media bridges. PostgreSQL, media and worker queues remain private. Actual hardware and providers are not commissioned.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#06182b"/><stop offset="1" stop-color="#0e3043"/></linearGradient>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9 Z" fill="#e8bc6c"/></marker>
</defs>
<rect width="1440" height="920" rx="22" fill="url(#bg)"/>
<g font-family="Arial, Helvetica, sans-serif">
