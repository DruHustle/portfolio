<text x="31" y="106" font-size="22" fill="#57e6b8" font-weight="500">Farm equipment and offline field work → authorized API → trusted records</text>
<text x="31" y="133" font-size="17" fill="#aec8d9" font-weight="400">Independent application boundaries · provenance-aware integrations</text>
