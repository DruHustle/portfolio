nt-weight="400">Listings, offers, services</text><rect x="736" y="156" width="322" height="640" rx="18" fill="#0d2639" stroke="#355875" stroke-width="1.5"/><rect x="737" y="157" width="320" height="92" rx="16" fill="#13374b" stroke="none" stroke-width="1.5"/><circle cx="767" cy="198" r="17" fill="#a5b4fc"/><text x="761" y="205" font-size="17" fill="#0c2335" font-weight="700">3</text><text x="793" y="199" font-size="22" fill="#f8fafc" font-weight="700">DATA &amp; TRUST</text><text x="754" y="231" font-size="15" fill="#bdd1df" font-weight="400">Durable authorized storage</text><rect x="752" y="270" width="290" height="105" rx="13" fill="#132f42" stroke="#3e637a" stroke-width="1.5"/><rect x="752" y="270" width="5" height="105" rx="2" fill="#a5b4fc"/><text x="769" y="307" font-size="19" fill="#f1f9ff" font-weight="650">PostgreSQL 17</text><text x="769" y="337" font-size="15" fill="#c0d7e3" font-weight="400">Farm records, audit and versions</text><rect x="752" y="393" width="290" height="105" rx="13" fill="#132f42" stroke="#3e637a" stroke-width="1.5"/><rect x="752" y="393" width="5" height="105" rx="2" fill="#a5b4fc"/><text x="769" y="430" font-size="19" fill="#f1f9ff" font-weight="650">Private object storage</text><text x="769" y="460" font-size="15" fill="#c0d7e3" font-weight="400">Camera clips and documents</text><rect x="752" y="516" width="290" height="105" rx="13" fill="#132f42" stroke="#3e637a" stroke-width="1.5"/><rect x="752" y="516" width="5" height="105" rx="2" fill="#a5b4fc"/><text x="769" y="553" font-size="19" fill="#f1f9ff" font-weight="650">Outbox and worker</text><text x="769" y="583" font-size="15" fill="#c0d7e3" font-weight="400">Sync, notifications, expiry</text><rect x="752" y="639" width="290" height="105" rx="13" fill="#132f42" stroke="#3e637a" stroke-width="1.5"/><rect x="752" y="639" width="5" height="105" rx="2" fill="#a5b4fc"/><text x="769" y="676" font-size="19" fill="#f1f9ff" font-weight="650">Privacy controls</text><text x="769" y="706" font-size="15" fill="#c0d7e3" font-weight="400">Media grants, source quality</text><rect x="1090" y="156" width="322" height="640" rx="18" fill="#0d2639" stroke="#355875" stroke-width="1.5"/><rect x="1091" y="157" width="320" height="92" rx="16" fill="#13374b" stroke="none" stroke-width="1.5"/><circle cx="1121" cy="198" r="17" fill="#36d5b3"/><text x="1115" y="205" font-size="17" fill="#0c2335" font-weight="700">4</text><text x="1147" y="199" font-size="22" fill="#f8fafc" font-weight="700">WEB &amp; MOBILE</text><text x="1108" y="231" font-size="15" fill="#bdd1df" font-weight="400">Separate experience projects</text><rect x="1106" y="270" width="290" height="105" rx="13" fill="#132f42" stroke="#3e637a" stroke-width="1.5"/><rect x="1106" y="270" width="5" height="105" rx="2" fill="#36d5b3"/><text x="1123" y="307" font-size="19" fill="#f1f9ff" font-weight="650">Responsive PWA</text><text x="1123" y="337" font-size="15" fill="#c0d7e3" font-weight="400">Independent React web app</text><rect x="1106" y="393" width="290" height="105" rx="13" fill="#132f42" stroke="#3e637a" stroke-width="1.5"/><rect x="1106" y="393" width="5" height="105" rx="2" fill="#36d5b3"/><text x="1123" y="430" font-size="19" fill="#f1f9ff" font-weight="650">Android + iOS/iPad</text><text x="1123" y="460" font-size="15" fill="#c0d7e3" font-weight="400">Native mobile + tablet UX</text><rect x="1106" y="516" width="290" height="105" rx="13" fill="#132f42" stroke="#3e637a" stroke-width="1.5"/><rect x="1106" y="516" width="5" height="105" rx="2" fill="#36d5b3"/><text x="1123" y="553" font-size="19" fill="#f1f9ff" font-weight="650">Encrypted offline work</text><text x="1123" y="583" font-size="15" fill="#c0d7e3" font-weight="400">IndexedDB / SQLCipher queues</text><rect x="1106" y="639" width="290" height="105" rx="13" fill="#132f42" stroke="#3e637a" stroke-width="1.5"/><rect x="1106" y="639" width="5" height="105" rx="2" fill="#36d5b3"/><text x="1123" y="676" font-size="19" fill="#f1f9ff" font-weight="650">Shona &amp; Ndebele</text><text x="1123" y="706" font-size="15" fill="#c0d7e3" font-weight="400">Fluent review still required</text>
