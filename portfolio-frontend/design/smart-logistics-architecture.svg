<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title description">
<title id="title">Smart Logistics — system architecture</title>
<desc id="description">Independent warehouse and fleet Node-RED inputs feed a Python durable queue and signed HTTPS ingress. The Oracle-hosted gateway and application services validate sessions, project shipments, manage exceptions, receiving and purchasing, and persist provenance-aware PostgreSQL records. Vercel serves the frontend. Edge equipment remains uncommissioned.</desc>
